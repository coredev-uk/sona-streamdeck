<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="sdpi-components.js"></script>
	<link rel="stylesheet" href="sona.css">
</head>
<body>
	<sdpi-item label="Grid columns">
		<sdpi-select setting="columns" default="2">
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Grid rows">
		<sdpi-select setting="rows" default="2">
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="This key's column">
		<sdpi-select setting="column" default="1">
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="This key's row">
		<sdpi-select setting="row" default="1">
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Sona">
		<p id="sona-connection" class="sona-status">Connecting…</p>
	</sdpi-item>
	<details class="sona-advanced">
		<summary>Where Sona is</summary>
		<sdpi-item label="sona">
			<sdpi-textfield global setting="sonaPath" placeholder="Found on its own"></sdpi-textfield>
		</sdpi-item>
		<p class="sona-hint">Only when Sona isn't installed where its installer puts it, or on your PATH: the full path to <code>sona</code> (<code>sona.exe</code> on Windows).</p>
	</details>
	<script src="connection.js"></script>
</body>
</html>
